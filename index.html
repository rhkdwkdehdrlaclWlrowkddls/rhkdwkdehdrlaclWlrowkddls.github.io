<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김남우 · Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <svg class="logo" viewBox="0 0 16 16" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span class="crumb" id="topName"></span>
    </div>
    <button class="btn icon-btn" id="themeToggle" aria-label="테마 전환">🌙</button>
  </header>

  <nav class="tabs" id="tabs">
    <div class="tabs-inner">
      <a href="#overview" data-tab="overview" class="tab active">📖 Overview</a>
      <a href="#repositories" data-tab="repositories" class="tab">📦 Repositories <span class="counter" id="repoCount">–</span></a>
      <a href="#about" data-tab="about" class="tab">👤 About</a>
    </div>
  </nav>

  <main class="layout">
    <aside class="profile">
      <img class="avatar" id="avatar" alt="프로필 사진" />
      <div class="status" id="status"></div>
      <h1 class="names"><span class="fullname" id="name"></span><span class="username" id="username"></span></h1>
      <a class="btn btn-block" id="followBtn" target="_blank" rel="noopener">Follow on GitHub</a>
      <p class="bio" id="bio"></p>
      <ul class="meta" id="meta"></ul>
    </aside>

    <section class="content">
      <div class="panel active" id="panel-overview">
        <article class="box readme">
          <div class="readme-head"><span id="readmePath"></span>/README.md</div>
          <div class="readme-body markdown" id="readme"></div>
        </article>

        <h2 class="section-title">Pinned</h2>
        <div class="pinned" id="pinned"></div>

        <h2 class="section-title" id="contribTitle">Activity</h2>
        <div class="box contrib">
          <div class="graph" id="graph"></div>
          <div class="legend">Less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</div>
        </div>
      </div>

      <div class="panel" id="panel-repositories">
        <input class="search" id="repoSearch" type="search" placeholder="Find a repository…" />
        <ul class="repo-list" id="repoList"><li class="empty">불러오는 중…</li></ul>
      </div>

      <div class="panel" id="panel-about">
        <article class="box pad markdown">
          <h2>Skills</h2>
          <div class="chips" id="skills"></div>
          <h2>Contact</h2>
          <ul class="meta" id="contact"></ul>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> <span id="footName"></span> · Hosted on GitHub Pages</footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
